[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eia-natural-gas-storage-skill"
version = "1.0.0"
description = "Portable retrieval and analysis for EIA Weekly Natural Gas Storage data"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]

[tool.setuptools.packages.find]
include = ["eia_storage*"]
